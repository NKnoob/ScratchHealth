<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="570.38066" height="206.06079" viewBox="0,0,570.38066,206.06079"><defs><radialGradient cx="620" cy="380.00001" r="282.69033" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#000000" stop-opacity="0.09804"/><stop offset="1" stop-color="#000000" stop-opacity="0.03922"/></radialGradient></defs><g transform="translate(-334.80967,-276.96961)"><g stroke-miterlimit="10"><path d="M902.69033,448.88481c0,17.47587 -23.94454,31.6456 -53.46206,31.6456h-458.46276c-29.52373,0 -53.45584,-14.1734 -53.45584,-31.6456v-137.77327c0,-17.47587 23.93211,-31.64192 53.45584,-31.64192h458.45655c29.53616,0 53.46206,14.16604 53.46206,31.64192v137.77327z" fill="#9ef259" stroke="url(#color-1)" stroke-width="5"/><text transform="translate(395.12026,328.13863) scale(0.57315,0.57315)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;MPLUSRounded1c-Medium&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">XÂY DỰNG THÓI QUEN SỐNG LÀNH MẠNH</tspan></text><text transform="translate(379.53676,361.69498) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;MPLUSRounded1c-Medium&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Một cơ thể khỏe mạnh bắt đầu từ những thói quen</tspan><tspan x="0" dy="46.150000000000006px">nhỏ: ăn uống cân bằng, ngủ đủ giấc, vận động hằng</tspan><tspan x="0" dy="46.150000000000006px">ngày và hạn chế thức khuya – đồ ngọt.  Những  lựa</tspan><tspan x="0" dy="46.150000000000006px">chọn lành mạnh hôm nay sẽ giúp bạn phát triển tốt</tspan><tspan x="0" dy="46.150000000000006px">hơn trong tương lai.</tspan></text></g></g></svg>