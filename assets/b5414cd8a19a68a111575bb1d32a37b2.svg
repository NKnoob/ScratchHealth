<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="570.38066" height="210.98189" viewBox="0,0,570.38066,210.98189"><defs><radialGradient cx="619.99998" cy="380.00001" r="282.69033" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#000000" stop-opacity="0.09804"/><stop offset="1" stop-color="#000000" stop-opacity="0.03922"/></radialGradient></defs><g transform="translate(-334.80967,-274.50906)"><g stroke-miterlimit="10"><path d="M902.69033,450.57082c0,17.90361 -23.94454,32.42014 -53.46206,32.42014h-458.46276c-29.52373,0 -53.45584,-14.5203 -53.45584,-32.42014v-141.14537c0,-17.90361 23.93211,-32.41638 53.45584,-32.41638h458.45655c29.53616,0 53.46206,14.51277 53.46206,32.41638v141.14537z" fill="#5ce1e6" stroke="url(#color-1)" stroke-width="5"/><text transform="translate(422.18635,341.19037) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#5ce1e6" stroke="none" stroke-width="1" font-family="&quot;MPLUSRounded1c-Medium&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Vệ</tspan></text><text transform="translate(392.6597,325.67807) scale(0.57315,0.57315)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;MPLUSRounded1c-Medium&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">NHỮNG THAY ĐỔI SINH LÝ Ở TUỔI DẬY THÌ</tspan></text><text transform="translate(367.23398,363.33536) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;MPLUSRounded1c-Medium&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Tuổi dậy thì là giai đoạn cơ thể phát triển nhanh  nhất.</tspan><tspan x="0" dy="46.150000000000006px">Bạn sẽ cao hơn, nặng hơn và có nhiều thay đổi bất ngờ.</tspan><tspan x="0" dy="46.150000000000006px">Những thay đổi này hoàn toàn bình  thường  và  là  dấu</tspan><tspan x="0" dy="46.150000000000006px">hiệu cho thấy bạn đang trưởng thành. Hãy hiểu cơ thể</tspan><tspan x="0" dy="46.150000000000006px">mình để chăm sóc nó tốt hơn nhé!</tspan></text></g></g></svg>