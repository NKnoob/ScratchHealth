<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="570.38066" height="203.60023" viewBox="0,0,570.38066,203.60023"><defs><radialGradient cx="620" cy="380.00001" r="282.69033" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#000000" stop-opacity="0.09804"/><stop offset="1" stop-color="#000000" stop-opacity="0.03922"/></radialGradient></defs><g transform="translate(-334.80967,-278.1999)"><g stroke-miterlimit="10"><path d="M902.69033,448.04181c0,17.262 -23.94454,31.25832 -53.46206,31.25832h-458.46276c-29.52373,0 -53.45584,-13.99995 -53.45584,-31.25832v-136.08722c0,-17.262 23.93211,-31.25469 53.45584,-31.25469h458.45655c29.53616,0 53.46206,13.99268 53.46206,31.25469v136.08722z" fill="#ffca18" stroke="url(#color-1)" stroke-width="5"/><text transform="translate(452.53319,329.36892) scale(0.57315,0.57315)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;MPLUSRounded1c-Medium&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">TÂM LÝ, CẢM XÚC TUỔI DẬY THÌ</tspan></text><text transform="translate(366.4138,362.10508) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;MPLUSRounded1c-Medium&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Ở tuổi dậy thì, cảm xúc của bạn có thể thay đổi nhanh</tspan><tspan x="0" dy="46.150000000000006px">và mạnh.  Buồn  vui thất  thường,  nhạy  cảm  hoặc dễ</tspan><tspan x="0" dy="46.150000000000006px">căng  thẳng  đều  là  bình  thường.  Hiểu cảm xúc củ a</tspan><tspan x="0" dy="46.150000000000006px">mình  và chia sẻ  với  người đáng tin cậy sẽ giúp  bạn</tspan><tspan x="0" dy="46.150000000000006px">vượt qua giai đoạn này một cách nhẹ nhàng hơn.</tspan></text></g></g></svg>