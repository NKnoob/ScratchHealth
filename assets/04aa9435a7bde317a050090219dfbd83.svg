<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="570.38066" height="192.11764" viewBox="0,0,570.38066,192.11764"><defs><radialGradient cx="620" cy="380" r="282.69033" gradientUnits="userSpaceOnUse" id="color-1"><stop offset="0" stop-color="#000000" stop-opacity="0.09804"/><stop offset="1" stop-color="#000000" stop-opacity="0.03922"/></radialGradient></defs><g transform="translate(-334.80967,-283.94118)"><g stroke-miterlimit="10"><path d="M902.69033,444.10778c0,16.26396 -23.94454,29.45104 -53.46206,29.45104h-458.46276c-29.52373,0 -53.45584,-13.1905 -53.45584,-29.45104v-128.21898c0,-16.26396 23.93211,-29.44762 53.45584,-29.44762h458.45655c29.53616,0 53.46206,13.18366 53.46206,29.44762v128.21898z" fill="#ffaec8" stroke="url(#color-1)" stroke-width="5"/><text transform="translate(450.89282,335.1102) scale(0.57315,0.57315)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;MPLUSRounded1c-Medium&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">KỸ NĂNG SỐNG - MỐI QUAN HỆ</tspan></text><text transform="translate(367.23398,364.56562) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="&quot;MPLUSRounded1c-Medium&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Kỹ năng sống giúp bạn tự tin, bình  tĩnh  và  sẵn  sàng</tspan><tspan x="0" dy="46.150000000000006px">trước mọi tình huống. Biết giao tiếp, quản lý cảm xúc,</tspan><tspan x="0" dy="46.150000000000006px">giải quyết vấn đề và bảo vệ bản thân  là chìa  khóa  để</tspan><tspan x="0" dy="46.150000000000006px">bạn trưởng thành. Hãy  luyện  tập  mỗi  ngày  để  trở</tspan><tspan x="0" dy="46.150000000000006px">nên mạnh mẽ và độc lập hơn.</tspan></text></g></g></svg>